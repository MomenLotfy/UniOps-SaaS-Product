################################################################################
# Namespace — uniops
# All app resources live here.
# PSA: enforce=baseline (blocks privileged/hostPath), warn=restricted
################################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/managed-by: kustomize
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

---
################################################################################
# ResourceQuota — hard caps per namespace to prevent runaway resource usage
################################################################################
apiVersion: v1
kind: ResourceQuota
metadata:
  name: uniops-quota
  namespace: uniops
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "15"
    pods: "60"
    services: "20"
    secrets: "30"
    configmaps: "20"

---
################################################################################
# LimitRange — default requests/limits for containers that omit them
################################################################################
apiVersion: v1
kind: LimitRange
metadata:
  name: uniops-limits
  namespace: uniops
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: PersistentVolumeClaim
      max:
        storage: 50Gi
      min:
        storage: 100Mi
