apiVersion: v1
kind: Namespace
metadata:
  name: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: uniops-quota
  namespace: uniops
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: uniops-limits
  namespace: uniops
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
