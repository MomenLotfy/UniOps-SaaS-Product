################################################################################
# Ingress — nginx-ingress-controller
#
# Prerequisites (install once per cluster):
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/
#     controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# TLS / cert-manager annotation are added ONLY in the prod overlay.
# Dev overlay uses nip.io hostname + plain HTTP.
#
# Routing:
#   /api/*      → backend:80 (FastAPI)
#   /ws/*       → backend:80 (WebSocket — long timeout + Upgrade headers)
#   /webhooks/* → backend:80 (GitHub / Stripe / GitLab webhooks)
#   /*          → frontend:80 (React SPA — nginx)
################################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uniops-ingress
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    # WebSocket support — required for /ws/* routes
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # File uploads up to 50MB (scan reports, ML datasets)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  # NOTE: TLS section is added by prod overlay via strategic merge patch
  rules:
    - host: uniops.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
