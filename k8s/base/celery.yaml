##############################################################################
# Celery Worker — Deployment
# Handles: scans, cost sync, ML retrain, notification delivery
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: uniops
  labels:
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: celery-worker
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379;    do echo "waiting redis";    sleep 2; done
              until nc -z postgres 5432; do echo "waiting postgres"; sleep 2; done
      containers:
        - name: celery-worker
          image: ghcr.io/your-org/uniops-backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - app.tasks.worker
            - worker
            - --loglevel=info
            - --concurrency=4
            - -Q
            - default,scans
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: models-storage
              mountPath: /app/models
            - name: docker-sock
              mountPath: /var/run/docker.sock
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A app.tasks.worker inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: models-storage
          persistentVolumeClaim:
            claimName: models-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

---
##############################################################################
# Celery Beat — single replica ONLY (prevents duplicate schedules)
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: uniops
  labels:
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: celery-beat
        app.kubernetes.io/component: scheduler
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting redis"; sleep 2; done
      containers:
        - name: celery-beat
          image: ghcr.io/your-org/uniops-backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - app.tasks.worker
            - beat
            - --loglevel=info
            - --scheduler
            - celery.beat.PersistentScheduler
            - --schedule
            - /app/celerybeat-schedule/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: beat-schedule
              mountPath: /app/celerybeat-schedule
      volumes:
        - name: beat-schedule
          persistentVolumeClaim:
            claimName: celerybeat-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celerybeat-pvc
  namespace: uniops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
