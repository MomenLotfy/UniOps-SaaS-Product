apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: uniops
  labels:
    app: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      serviceAccountName: uniops-worker
      imagePullSecrets:
        - name: dockerhub-secret
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: celery-worker
          image: momenpanda/uniops-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.tasks.worker
            - worker
            - --loglevel=info
            - --pool=prefork
            - --concurrency=4
            - --max-tasks-per-child=1
            - --prefetch-multiplier=1
            - -Q
            - default,scans
            - --without-heartbeat
            - --without-gossip
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: CELERY_RESULT_BACKEND
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A app.tasks.worker inspect ping -d "celery@$HOSTNAME" --timeout 15
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 20
      volumes:
        - name: models-storage
          persistentVolumeClaim:
            claimName: models-pvc
        - name: logs-storage
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: uniops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      serviceAccountName: uniops-worker
      imagePullSecrets:
        - name: dockerhub-secret
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
      containers:
        - name: celery-beat
          image: momenpanda/uniops-backend:latest
          command:
            - celery
            - -A
            - app.tasks.worker
            - beat
            - --loglevel=info
            - --scheduler
            - celery.beat.PersistentScheduler
            - --schedule
            - /app/celerybeat-schedule/celerybeat-schedule
            - --pidfile
            - /tmp/celerybeat.pid
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: CELERY_RESULT_BACKEND
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          volumeMounts:
            - name: beat-schedule
              mountPath: /app/celerybeat-schedule
            - name: beat-tmp
              mountPath: /tmp
      volumes:
        - name: beat-schedule
          persistentVolumeClaim:
            claimName: celerybeat-pvc
        - name: beat-tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celerybeat-pvc
  namespace: uniops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
