################################################################################
# DB Migration Job
# - ArgoCD PreSync hook: runs BEFORE any other resource is updated
# - Also acts as standalone job for non-ArgoCD deployments
# - Uses psycopg2 (sync driver) because alembic.ini specifies it
# - backoffLimit: 3 → retries on transient DB failures
# - Deleted 5 min after success to keep cluster clean
################################################################################
apiVersion: batch/v1
kind: Job
metadata:
  name: uniops-migrate
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops-migrate
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: uniops-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: uniops-backend
      imagePullSecrets:
        - name: dockerhub-secret 
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at postgres:5432..."
              until nc -z postgres 5432; do
                echo "  postgres not ready, retrying in 3s..."
                sleep 3
              done
              echo "PostgreSQL is ready."
      containers:
        - name: migrate
          image: momenpanda/uniops-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Use psycopg2 (sync) driver — alembic.ini requires it
          command:
            - sh
            - -c
            - |
              echo "Running alembic migrations..."
              alembic upgrade head
              echo "Migrations complete."
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            # Override DATABASE_URL: use asyncpg (async) for alembic
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
################################################################################
# Backend — Deployment (FastAPI + uvicorn)
# - Command overrides entrypoint.sh: migrations handled by the Job above
# - initContainers gate on postgres + redis readiness
# - REDIS_URL/BROKER/RESULT include password (overrides ConfigMap plain URLs)
# - Prometheus scrape annotations for auto-discovery
# - models-pvc mounted RWX (multiple pods + celery workers share ML models)
################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: uniops
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0    # zero-downtime: always keep full replica count live
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: uniops-backend
      imagePullSecrets:
        - name: dockerhub-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # Note: backend image runs as root (/root/.local pip path in Dockerfile)
        # Container-level securityContext still hardens without breaking the app
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo "waiting postgres..."; sleep 2; done
              echo "postgres ready"
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do echo "waiting redis..."; sleep 2; done
              echo "redis ready"
      containers:
        - name: backend
          image: momenpanda/uniops-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          # Override entrypoint.sh — migrations run via the Job above
          command:
            - python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "2"
            - --log-level
            - info
            - --no-access-log
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            # Authenticated Redis URLs — override plain ConfigMap values
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: CELERY_RESULT_BACKEND
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
            # Async PostgreSQL URL for runtime (asyncpg driver)
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18    # 90s startup budget (DB+migration time)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 0  # startupProbe handles initial wait
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: models-storage
              mountPath: /app/models
            - name: logs-storage
              mountPath: /app/logs
      volumes:
        - name: models-storage
          persistentVolumeClaim:
            claimName: models-pvc
        - name: logs-storage
          emptyDir: {}

---
################################################################################
# Models PVC — ReadWriteMany shared between backend replicas + celery workers
# REQUIRES NFS-backed storage in prod:
#   EKS: EFS with efs-sc StorageClass
#   GKE: Filestore with filestore StorageClass
#   AKS: Azure Files with azurefile StorageClass
#   Dev: patched to ReadWriteOnce in overlays/dev (minikube/kind compatible)
################################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: uniops
  labels:
    app.kubernetes.io/name: models-pvc
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  # Uncomment ONE for your cloud:
  # storageClassName: efs-sc       # AWS EKS (requires efs-csi-driver)
  # storageClassName: filestore    # GCP Filestore (GKE)
  # storageClassName: azurefile    # Azure Files (AKS)

---
################################################################################
# Backend — Service (ClusterIP)
# Port 80 → 8000: Ingress routes /api, /ws, /webhooks here
################################################################################
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: uniops
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8000
      name: http
      protocol: TCP
