##############################################################################
# DB Migration Job — runs once before backend starts (ArgoCD PreSync hook)
##############################################################################
apiVersion: batch/v1
kind: Job
metadata:
  name: uniops-migrate
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops-migrate
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: uniops-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 2; done
      containers:
        - name: migrate
          image: ghcr.io/your-org/uniops-backend:latest
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"

---
##############################################################################
# Backend — Deployment (FastAPI + uvicorn)
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: uniops
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo "waiting postgres"; sleep 2; done
              until nc -z redis 6379;    do echo "waiting redis";    sleep 2; done
      containers:
        - name: backend
          image: ghcr.io/your-org/uniops-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "2"
            - --log-level
            - info
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: models-storage
              mountPath: /app/models
            - name: logs-storage
              mountPath: /app/logs
      volumes:
        - name: models-storage
          persistentVolumeClaim:
            claimName: models-pvc
        - name: logs-storage
          emptyDir: {}

---
##############################################################################
# Models PVC — shared between backend + celery workers for .pkl files
##############################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: uniops
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  # storageClassName: efs-sc       # AWS EFS (EKS)
  # storageClassName: filestore    # GCP Filestore (GKE)
  # storageClassName: azurefile    # Azure Files (AKS)

---
##############################################################################
# Backend — Service (ClusterIP — accessed by Ingress + frontend)
##############################################################################
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: uniops
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8000
      name: http
