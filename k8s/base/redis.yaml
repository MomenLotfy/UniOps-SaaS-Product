################################################################################
# Redis 7 — StatefulSet
# Roles: app cache (DB 0) · Celery broker (DB 1) · Celery results (DB 2)
# AUTH enabled via REDIS_PASSWORD from Secret
# AOF persistence so Celery tasks survive pod restarts
# Headless service for stable DNS
################################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: uniops
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/component: cache
      annotations:
        prometheus.io/scrape: "false"   # enable if redis_exporter sidecar is added
    spec:
      terminationGracePeriodSeconds: 30
      # redis user in alpine image is uid/gid 999
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # Use sh -c to expand $REDIS_PASSWORD env var in the command
          command:
            - sh
            - -c
            - |
              exec redis-server \
                --requirepass "$REDIS_PASSWORD" \
                --appendonly yes \
                --appendfsync everysec \
                --maxmemory 256mb \
                --maxmemory-policy allkeys-lru \
                --save 60 1000 \
                --save 300 10 \
                --bind 0.0.0.0 \
                --protected-mode no \
                --loglevel notice
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uniops-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10   # 30s total startup budget
      volumes:
        - name: redis-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app.kubernetes.io/name: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
################################################################################
# Redis — Headless Service
################################################################################
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: uniops
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
      protocol: TCP
