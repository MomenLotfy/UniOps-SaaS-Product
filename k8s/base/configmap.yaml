apiVersion: v1
kind: ConfigMap
metadata:
  name: uniops-config
  labels:
    app.kubernetes.io/name: uniops
data:
  APP_NAME: "UniOps"
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: '["https://uniops.example.com"]'
  FRONTEND_URL: "https://uniops.example.com"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "5"
  DATABASE_POOL_RECYCLE: "300"
  DATABASE_POOL_PRE_PING: "true"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "1"
  CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
  CELERY_TASK_SERIALIZER: "json"
  CELERY_RESULT_SERIALIZER: "json"
  CELERY_ACCEPT_CONTENT: "json"
  CELERY_TIMEZONE: "UTC"
  CELERY_ENABLE_UTC: "true"
  PYTHONUNBUFFERED: "1"
  EMAIL_FROM: "noreply@uniops.io"
