apiVersion: v1
kind: ConfigMap
metadata:
  name: uniops-config
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
data:
  APP_NAME: "UniOps"
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  # Redis — service name inside cluster
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"

  # CORS — replace with your real domain in prod overlay
  CORS_ORIGINS: "https://uniops.example.com"
  FRONTEND_URL: "https://uniops.example.com"

  # AWS region (key/secret come from Secret)
  AWS_DEFAULT_REGION: "us-east-1"

  # Monitoring
  ENABLE_METRICS: "true"
  RATE_LIMIT_PER_MINUTE: "120"

  # Token TTLs
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  JWT_ALGORITHM: "HS256"

  # DB pool (credentials come from Secret — built per-pod)
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"
