################################################################################
# ConfigMap — non-sensitive runtime configuration
# Sensitive values (passwords, tokens) live in secret.yaml
# Redis URLs without password; per-pod env vars override with auth URL
################################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: uniops-config
  labels:
    app.kubernetes.io/name: uniops
data:
  # ── Application ──────────────────────────────────────────────────────────────
  APP_NAME: "UniOps"
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  # ── CORS & Frontend URL (override in overlays) ────────────────────────────────
  # IMPORTANT: Replace uniops.example.com with your real domain in prod overlay
  CORS_ORIGINS: '["https://uniops.example.com"]'
  FRONTEND_URL: "https://uniops.example.com"

  # ── AWS (credentials come from Secret) ────────────────────────────────────────
  AWS_DEFAULT_REGION: "us-east-1"

  # ── Observability ─────────────────────────────────────────────────────────────
  ENABLE_METRICS: "true"
  RATE_LIMIT_PER_MINUTE: "120"

  # ── Token TTLs ────────────────────────────────────────────────────────────────
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  JWT_ALGORITHM: "HS256"

  # ── Database pool (credentials + URL built dynamically per-pod via env vars) ──
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"
  DATABASE_POOL_TIMEOUT: "30"
  DATABASE_POOL_RECYCLE: "1800"

  # ── Celery ────────────────────────────────────────────────────────────────────
  CELERY_TASK_SERIALIZER: "json"
  CELERY_RESULT_SERIALIZER: "json"
  CELERY_ACCEPT_CONTENT: "json"
  CELERY_TIMEZONE: "UTC"
  CELERY_ENABLE_UTC: "true"
  CELERY_TASK_TRACK_STARTED: "true"
  CELERY_TASK_TIME_LIMIT: "3600"
  CELERY_TASK_SOFT_TIME_LIMIT: "3300"

  # ── Email ─────────────────────────────────────────────────────────────────────
  EMAIL_FROM: "noreply@uniops.io"
