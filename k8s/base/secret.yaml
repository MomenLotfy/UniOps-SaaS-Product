# ──────────────────────────────────────────────────────────────────────────────
# TEMPLATE — do NOT commit real values.
# Use Sealed Secrets, External Secrets Operator, or Vault for production.
#
# Quick setup for dev/local:
#   bash k8s/scripts/setup-secrets.sh dev
#
# Generate individual values:
#   openssl rand -hex 32        → SECRET_KEY / JWT_SECRET_KEY
#   openssl rand -base64 20     → POSTGRES_PASSWORD
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: uniops-secrets
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
type: Opaque
stringData:
  # ── App security ─────────────────────────────────────────────────────────────
  SECRET_KEY: "REPLACE_WITH_openssl_rand_hex_32"
  JWT_SECRET_KEY: "REPLACE_WITH_openssl_rand_hex_32"

  # ── Database ──────────────────────────────────────────────────────────────────
  POSTGRES_USER: "uniops"
  POSTGRES_PASSWORD: "REPLACE_WITH_strong_password"
  POSTGRES_DB: "uniops_db"

  # ── Optional integrations (leave empty to use demo/mock data) ─────────────────
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  GITHUB_TOKEN: ""
  GITHUB_WEBHOOK_SECRET: ""
  GITLAB_TOKEN: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  SLACK_BOT_TOKEN: ""
  SLACK_WEBHOOK_URL: ""
  SENDGRID_API_KEY: ""
  EMAIL_FROM: "noreply@uniops.io"
  SENTRY_DSN: ""
