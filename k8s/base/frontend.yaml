################################################################################
# Frontend — Deployment (React SPA served by nginx)
# nginx.conf verified: /health endpoint returns 200 "ok"
# Security headers added in nginx.conf (X-Frame-Options, CSP, etc.)
# tmpfs volumes for nginx write dirs → readOnlyRootFilesystem compatible
################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: uniops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: uniops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0    # zero-downtime: always have at least 2 pods live
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: uniops
    spec:
      serviceAccountName: uniops-frontend
      imagePullSecrets:
        - name: dockerhub-secret  
      securityContext:
        # nginx:1.27-alpine default nginx user runs as uid 101
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: momenpanda/uniops-frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # nginx on port 80 needs NET_BIND_SERVICE (port < 1024)
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            # nginx needs write access to these dirs at runtime
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
            # Override the image's baked-in default.conf so nginx binds 8080
            # (port 80 fails as non-root). Mirrors the live cluster fix.
            - name: nginx-override
              mountPath: /etc/nginx/conf.d
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      volumes:
        # emptyDir (tmpfs) for nginx write directories → readOnlyRootFilesystem safe
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-override
          configMap:
            name: frontend-nginx-override
            items:
              - key: default.conf
                path: default.conf

---
################################################################################
# Frontend — Service (ClusterIP)
# Ingress routes path "/" → frontend:80
################################################################################
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: uniops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
      name: http
      protocol: TCP

---
################################################################################
# Frontend nginx override — ConfigMap
# Mounted at /etc/nginx/conf.d in the frontend pod, overriding the image's
# baked-in default.conf (which listens on port 80 and fails as non-root).
# Listening on 8080 is required because runAsUser=101 can't bind port < 1024.
################################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-override
  namespace: uniops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
data:
  default.conf: |
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Health endpoint
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }
