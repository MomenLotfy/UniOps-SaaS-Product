################################################################################
# Frontend — Deployment (React SPA served by nginx)
# nginx.conf verified: /health endpoint returns 200 "ok"
# Security headers added in nginx.conf (X-Frame-Options, CSP, etc.)
# tmpfs volumes for nginx write dirs → readOnlyRootFilesystem compatible
################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: uniops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0    # zero-downtime: always have at least 2 pods live
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: uniops-frontend
      securityContext:
        # nginx:1.27-alpine default nginx user runs as uid 101
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: uniops-frontend:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # nginx on port 80 needs NET_BIND_SERVICE (port < 1024)
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            # nginx needs write access to these dirs at runtime
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      volumes:
        # emptyDir (tmpfs) for nginx write directories → readOnlyRootFilesystem safe
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}

---
################################################################################
# Frontend — Service (ClusterIP)
# Ingress routes path "/" → frontend:80
################################################################################
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: uniops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
      protocol: TCP
