##############################################################################
# Frontend — Deployment (React SPA served by nginx)
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: uniops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/uniops-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

---
##############################################################################
# Frontend — Service (ClusterIP — Ingress routes traffic here)
##############################################################################
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: uniops
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
