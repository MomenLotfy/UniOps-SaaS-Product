apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uniops

resources:
  - ../../base
  - ../../base/cert-manager.yaml   # ClusterIssuer — requires cert-manager installed

# Prod: high availability replicas
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: celery-worker
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: node-api
  # Prod: higher resource limits for backend
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
    target:
      kind: Deployment
      name: backend
  # Prod: pin to Always pull policy
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment

# Prod: pin to specific release tag — update before each release
images:
  - name: ghcr.io/your-org/uniops-backend
    newTag: "1.0.0"
  - name: ghcr.io/your-org/uniops-frontend
    newTag: "1.0.0"
  - name: ghcr.io/your-org/uniops-node-api
    newTag: "1.0.0"

# Prod: production config overrides
configMapGenerator:
  - name: uniops-config
    behavior: merge
    literals:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - RATE_LIMIT_PER_MINUTE=60
      - CORS_ORIGINS=https://uniops.example.com
      - FRONTEND_URL=https://uniops.example.com
