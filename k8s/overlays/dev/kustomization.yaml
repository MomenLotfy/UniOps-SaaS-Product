apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uniops
resources:
  - ../../base
images:
  # Kustomize `images:` matches by the full image string in the rendered
  # output. The base manifests use DockerHub images; the dev overlay only
  # swaps the FRONTEND to the ECR pin (the protected live pin per the
  # INFRA-REPORT). Backend stays on the base DockerHub image so the script's
  # Phase 6 image-drift assertion in start-app-infra.sh remains consistent
  # with what the dev overlay renders.
  - name: momenpanda/uniops-backend:latest
    newName: 663476173962.dkr.ecr.us-east-2.amazonaws.com/uniops-backend
    newTag: 1c7549808887c803f35417751f3779e987cda6ee-42
configMapGenerator:
  - name: uniops-config
    behavior: merge
    literals:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://uniops.local"]
      - FRONTEND_URL=http://uniops.local
patches:
  - target:
      kind: PersistentVolumeClaim
      name: models-pvc
    patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteOnce
