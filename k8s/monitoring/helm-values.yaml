# ==============================================================================
# kube-prometheus-stack — Helm values for the UniOps cluster
# ------------------------------------------------------------------------------
# Source of truth: ccc prompt.md (jun-2026). Hard-coded values per the prompt:
#   - Prometheus: 20Gi PVC, 15-day retention
#   - Grafana:    5Gi PVC, admin password UniOps@Grafana2026, dashboards
#                 loaded from the `grafana-dashboards` ConfigMap into the
#                 `UniOps` folder
#   - AlertManager: 5Gi PVC
#   - All storage uses the `ebs-csi` StorageClass (dynamic provisioning)
# ==============================================================================
prometheus:
  prometheusSpec:
    # Allow the operator to discover ServiceMonitors/PodMonitors that don't
    # carry a `release: kube-prometheus-stack` label — this is required for
    # the project's existing `ServiceMonitor/uniops-backend` (which has the
    # right label) AND for future custom monitors.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

    # 15-day retention as per the prompt.
    retention: 15d

    # Dynamic EBS-backed PVC; ebs-csi is WaitForFirstConsumer so the PVC
    # only binds once Prometheus schedules onto a node.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  # Hard-coded per the prompt. Will be moved to a K8s Secret in a later
  # iteration; for now the prompt explicitly says "these exact values".
  adminPassword: "UniOps@Grafana2026"

  persistence:
    enabled: true
    storageClassName: ebs-csi
    size: 5Gi

  # Sidecar-driven dashboard loading: a Grafana init container watches
  # the ConfigMap and writes dashboards to /var/lib/grafana/dashboards/default.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: UniOps
          type: file
          options:
            path: /var/lib/grafana/dashboards/default

  # Reference the ConfigMap that holds the 6 dashboards (created in Step 3).
  dashboardsConfigMaps:
    default: grafana-dashboards

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
