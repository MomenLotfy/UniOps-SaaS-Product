##############################################################################
# UniOps Control Tower — Docker Compose (host networking)
##############################################################################

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: uniops
      POSTGRES_PASSWORD: uniops_password
      POSTGRES_DB: uniops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --save "" --appendonly no

  # ── Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: ./backend/.env.host
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - models_data:/app/models
      - backend_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
      - redis

  # ── Celery Worker ─────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: ./backend/.env.host
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
    depends_on:
      - backend
      - redis
    command: ["celery", "-A", "app.tasks.worker", "worker", "--loglevel=info", "--concurrency=2", "-Q", "default,scans"]

  # ── Celery Beat ─────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: ./backend/.env.host
    depends_on:
      - backend
      - redis
    volumes:
      - celery_beat_data:/app/beat
    command: ["celery", "-A", "app.tasks.worker", "beat", "--loglevel=info", "--scheduler", "celery.beat.PersistentScheduler", "--schedule", "/app/beat/celerybeat-schedule"]

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: artifacts/uniops/Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./artifacts/uniops/src:/app/src
      - ./artifacts/uniops/public:/app/public

volumes:
  postgres_data:
  models_data:
  backend_logs:
  celery_beat_data: