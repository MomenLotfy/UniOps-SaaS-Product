---
# Sprint 4 — Prometheus Adapter Deployment + Service.
# Uses the upstream image direct-registry.k8s.io/prometheus-adapter/...
# pinned to a known-good version.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-adapter
    app.kubernetes.io/part-of: uniops-observability
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-adapter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6443"
    spec:
      serviceAccountName: prometheus-adapter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus-adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.11.2
          imagePullPolicy: IfNotPresent
          args:
            - /adapter
            - --secure-port=6443
            - --cert-dir=/tmp/cert
            - --tls-cipher-suites=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
            - --metrics-relist-interval=1m
            - --v=4
            - --config=/etc/adapter/config.yaml
            - --prometheus-url=http://prometheus.monitoring.svc:9090/
          ports:
            - name: https
              containerPort: 6443
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/adapter
            - name: tls-certs
              mountPath: /tmp/cert
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-adapter-config
        - name: tls-certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-adapter
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 6443
      targetPort: https
  selector:
    app.kubernetes.io/name: prometheus-adapter
---
# PodDisruptionBudget — never take the adapter offline simultaneously.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus-adapter
  namespace: monitoring
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-adapter
