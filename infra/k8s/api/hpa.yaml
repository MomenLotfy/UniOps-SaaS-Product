---
# Horizontal Pod Autoscaler.
# Scales on CPU + memory + a custom Prometheus metric
# (uniops_http_requests_in_progress) so the API scales with real load.
#
# Requires:
#   - metrics-server (CPU/memory)
#   - prometheus-adapter (custom metric) — exposes
#     uniops_http_requests_in_progress as k8s metric.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uniops-api
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uniops-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: uniops_http_requests_in_progress
        target:
          type: AverageValue
          averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max