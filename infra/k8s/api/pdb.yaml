---
# PodDisruptionBudget — never let eviction take more than 1 of 3 replicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: uniops-api
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/component: api
spec:
  minAvailable: 2
  maxUnavailable: null
  selector:
    matchLabels:
      app.kubernetes.io/name: uniops
      app.kubernetes.io/component: api