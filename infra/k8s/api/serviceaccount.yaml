---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uniops-api
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
# Minimal Role — read-only access to its own configmap + secret.
# No wildcard access.  No cluster-scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uniops-api
  namespace: uniops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["uniops-config"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["uniops-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uniops-api
  namespace: uniops
subjects:
  - kind: ServiceAccount
    name: uniops-api
    namespace: uniops
roleRef:
  kind: Role
  name: uniops-api
  apiGroup: rbac.authorization.k8s.io