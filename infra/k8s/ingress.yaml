---
# Ingress for the public API.
# Uses ingress-nginx + cert-manager for automatic TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uniops-api
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.uniops.io
      secretName: uniops-api-tls
  rules:
    - host: api.uniops.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uniops-api
                port:
                  number: 8000