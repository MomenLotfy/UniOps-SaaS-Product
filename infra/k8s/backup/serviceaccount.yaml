---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops-backup
---
# Least-privilege: the backup job does not need to read arbitrary
# secrets or list other workloads.  The DSN and (optional) bucket
# creds are bound to the pod via `secretKeyRef` in the CronJob spec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-backup
  namespace: uniops
rules: []  # no in-cluster API access required
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup
  namespace: uniops
subjects:
  - kind: ServiceAccount
    name: postgres-backup
    namespace: uniops
roleRef:
  kind: Role
  name: postgres-backup
  apiGroup: rbac.authorization.k8s.io
