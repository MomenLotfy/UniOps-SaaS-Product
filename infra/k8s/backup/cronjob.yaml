---
# ── Sprint 4: Kubernetes PostgreSQL backup CronJob ─────────────────────────
# Schedules a `pg_dump` of the production database to a PersistentVolume
# (or, when the PVC is empty / a CSI snapshot driver is configured, an
# operator can swap the `pg_dump` command for a volume snapshot — the
# surrounding plumbing remains identical).
#
# Configuration surface (all overridable via env / Secret):
#   SCHEDULE         — cron expression              (default: "0 3 * * *"  03:00 UTC)
#   BACKUP_RETENTION — days to keep before prune     (default: 14)
#   DATABASE_URL     — full PostgreSQL DSN           (from Secret)
#   BACKUP_BUCKET    — object store path (optional)  (from Secret; for off-cluster copy)
#   S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY
#                     — only required when BACKUP_BUCKET is set
#   SLACK_WEBHOOK_URL — failure notifications
#
# Operational behaviour:
#   - `restartPolicy: OnFailure`     — never a tight retry loop
#   - `activeDeadlineSeconds: 7200`  — 2h hard cap; PVC issues must not hang forever
#   - `successfulJobsHistoryLimit: 3` / `failedJobsHistoryLimit: 3`
#   - `backoffLimit: 2`              — two retries on transient errors
#   - Dedicated `ServiceAccount` + least-privilege `Role`/`RoleBinding`
#   - `resources.requests/limits` set so backup can never starve the API
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops-backup
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: uniops
spec:
  schedule: "0 3 * * *"  # 03:00 UTC daily — adjust per RPO requirement
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2h hard cap
      template:
        metadata:
          labels:
            app.kubernetes.io/name: uniops-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534  # nobody
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT="/backups/uniops-${TS}.sql.gz"
                  echo "[backup] starting pg_dump → ${OUT}"
                  pg_dump \
                    --dbname="${DATABASE_URL}" \
                    --no-owner \
                    --no-privileges \
                    --clean \
                    --if-exists \
                    --format=plain \
                    --compress=9 \
                    > "${OUT}"
                  echo "[backup] pg_dump complete — size $(du -h ${OUT} | cut -f1)"
                  # Optional: copy to object store when BACKUP_BUCKET is set
                  if [ -n "${BACKUP_BUCKET:-}" ]; then
                    echo "[backup] uploading to ${BACKUP_BUCKET}/${TS}.sql.gz"
                    if [ -n "${S3_ENDPOINT:-}" ]; then
                      AWS_ENDPOINT_URL="${S3_ENDPOINT}" \
                      aws s3 cp "${OUT}" "s3://${BACKUP_BUCKET}/${TS}.sql.gz"
                    else
                      aws s3 cp "${OUT}" "s3://${BACKUP_BUCKET}/${TS}.sql.gz"
                    fi
                  fi
                  # Retention prune — remove local files older than N days
                  RETENTION="${BACKUP_RETENTION:-14}"
                  find /backups -type f -name "*.sql.gz" -mtime "+${RETENTION}" -delete
                  echo "[backup] retention prune complete (>${RETENTION}d removed)"
                  # Optional Slack ping
                  if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
                    curl -sf -X POST -H 'Content-Type: application/json' \
                      -d "{\"text\":\":white_check_mark: UniOps backup ok — ${TS}\"}" \
                      "${SLACK_WEBHOOK_URL}" || true
                  fi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: uniops-secrets
                      key: database-url
                - name: BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: uniops-secrets
                      key: backup-bucket
                      optional: true
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: uniops-secrets
                      key: s3-endpoint
                      optional: true
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: uniops-secrets
                      key: s3-access-key
                      optional: true
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: uniops-secrets
                      key: s3-secret-key
                      optional: true
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: uniops-secrets
                      key: slack-webhook-url
                      optional: true
                - name: BACKUP_RETENTION
                  value: "14"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: uniops-secrets
                      key: s3-access-key
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: uniops-secrets
                      key: s3-secret-key
                      optional: true
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              volumeMounts:
                - name: backup-volume
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
