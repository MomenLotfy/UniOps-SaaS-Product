apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uniops

resources:
  - ../../kustomization.yaml

namePrefix: dev-

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: uniops-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: uniops-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: "development"
      - op: replace
        path: /data/LOG_LEVEL
        value: "DEBUG"
      - op: replace
        path: /data/LOG_FORMAT
        value: "text"