---
# Namespace + default-deny NetworkPolicy.
# We deploy a "default-deny" stance: every Pod in this namespace must
# explicitly opt-in to ingress/egress.
apiVersion: v1
kind: Namespace
metadata:
  name: uniops
  labels:
    name: uniops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uniops-default-deny
  namespace: uniops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress