---
# Example Secret manifest.
# THIS FILE MUST NEVER CONTAIN REAL SECRETS — real values are injected
# via External Secrets Operator or `kubectl create secret`.
#
# Required keys:
#   DATABASE_URL              — asyncpg URL pointing at uniops-postgres
#   SECRET_KEY                — >=32-char random, generated per environment
#   JWT_SECRET_KEY            — >=32-char random, separate from SECRET_KEY
#   JWT_ALGORITHM             — typically "HS256"
#   SENTRY_DSN                — Sentry ingest URL
#   GITHUB_TOKEN              — optional, for GH integration
#   STRIPE_SECRET_KEY         — optional, for billing
#   SENDGRID_API_KEY          — optional, for email
apiVersion: v1
kind: Secret
metadata:
  name: uniops-secrets
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # The values below are placeholders so the manifest applies cleanly;
  # overlay patches in production overlay replace this whole file with
  # the actual ExternalSecret-managed Secret.  No real credentials live here.
  DATABASE_URL: "postgresql+asyncpg://REPLACE_AT_DEPLOY"
  SECRET_KEY: "REPLACE_AT_DEPLOY_minimum_32_chars_long_xxxxxxxx"
  JWT_SECRET_KEY: "REPLACE_AT_DEPLOY_minimum_32_chars_long_xxxxxxxx"
  JWT_ALGORITHM: "HS256"
  SENTRY_DSN: ""
  GITHUB_TOKEN: ""
  STRIPE_SECRET_KEY: ""
  SENDGRID_API_KEY: ""