---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uniops-celery-beat
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/component: celery-beat
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uniops-celery-beat
  namespace: uniops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["uniops-config"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["uniops-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uniops-celery-beat
  namespace: uniops
subjects:
  - kind: ServiceAccount
    name: uniops-celery-beat
    namespace: uniops
roleRef:
  kind: Role
  name: uniops-celery-beat
  apiGroup: rbac.authorization.k8s.io