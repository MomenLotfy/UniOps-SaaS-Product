---
# Celery Beat — singleton scheduler.
# 1 replica only — Beat must not run more than once at a time.  The
# scheduler picks up the beat_schedule from app.core.celery_app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniops-celery-beat
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
    app.kubernetes.io/component: celery-beat
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uniops
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uniops
        app.kubernetes.io/component: celery-beat
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: uniops-celery-beat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-beat
          image: ghcr.io/uniops/api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "info"]
          envFrom:
            - configMapRef:
                name: uniops-config
            - secretRef:
                name: uniops-secrets
          env:
            - name: ROLE
              value: "celery-beat"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # Beat doesn't expose HTTP; check the process is alive via exec.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps -ef | grep -v grep | grep 'celery.*beat' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}