################################################################################
# Base Kustomization — Source of truth for ALL UniOps k8s resources
#
# Usage: NEVER apply base directly. Always use an overlay:
#   kubectl apply -k k8s/overlays/dev
#   kubectl apply -k k8s/overlays/prod
#
# Resources are applied in this order by the API server.
# namespace.yaml must come first — all other resources need it to exist.
################################################################################
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uniops

resources:
  - namespace.yaml        # 1. Namespace + ResourceQuota + LimitRange
  - storageclass.yaml       # 2. EFS Storage Class
  - serviceaccount.yaml   # 3. ServiceAccounts + RBAC (Role + RoleBindings)
  - configmap.yaml        # 3. Non-sensitive runtime config
  - secret.yaml           # 4. Secret template (Local Dev only / Manual)
  - external-services.yaml  # 4b. External DB/Redis mappings
  - backend.yaml          # 5. Migration Job + Deployment + PVC + Service
  - celery.yaml           # 6. Worker Deployment + Beat Deployment + PVC
  - frontend.yaml         # 7. Deployment + Service
  - ingress.yaml          # 8. Ingress (TLS added by prod overlay)
  - ingress-catchall.yaml # 8b. Catch-all ingress (no host → NLB DNS reachable)
  - hpa.yaml              # 9. HPA for backend + celery-worker
  - pdb.yaml              # 10. PodDisruptionBudgets for all services
  - network-policy.yaml   # 11. NetworkPolicies (Zero Trust)
  - monitoring.yaml       # 12. Lightweight Observability (Prometheus, Grafana, Loki)

# Common labels applied to ALL resources (metadata.labels)
commonLabels:
  app.kubernetes.io/part-of: uniops
  app.kubernetes.io/managed-by: kustomize
