################################################################################
# ServiceAccounts — one per workload type, principle of least privilege
################################################################################

# Backend API — needs k8s client (kubernetes==29.0.0 in requirements.txt)
# Tasks: sync_pods, sync_pipelines read cluster state
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uniops-backend
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops-backend-sa
automountServiceAccountToken: true

---
# Celery workers use the same image → same k8s access needs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uniops-worker
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops-worker-sa
automountServiceAccountToken: true

---
# Frontend & Node API — no k8s API access needed
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uniops-frontend
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops-frontend-sa
automountServiceAccountToken: false

---
################################################################################
# Role — read-only access to common cluster resources (namespace-scoped)
# Backend reads pods/deployments for the sync_pods, sync_pipelines tasks
################################################################################
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uniops-k8s-reader
  namespace: uniops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
# Bind Role → backend ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uniops-backend-reader
  namespace: uniops
subjects:
  - kind: ServiceAccount
    name: uniops-backend
    namespace: uniops
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: uniops-k8s-reader

---
# Bind Role → worker ServiceAccount (celery sync_pods/sync_pipelines tasks)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uniops-worker-reader
  namespace: uniops
subjects:
  - kind: ServiceAccount
    name: uniops-worker
    namespace: uniops
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: uniops-k8s-reader
