################################################################################
# Secret — TEMPLATE ONLY. Never commit real values.
#
# How to create for development:
#   bash k8s/scripts/setup-secrets.sh dev
#
# How to create for production:
#   bash k8s/scripts/setup-secrets.sh prod
#
# Production best practice → use External Secrets Operator:
#   https://external-secrets.io
#   Sync from: AWS Secrets Manager / HashiCorp Vault / GCP Secret Manager
#
# Generate strong values manually:
#   SECRET_KEY:        openssl rand -hex 32
#   JWT_SECRET_KEY:    openssl rand -hex 32
#   POSTGRES_PASSWORD: openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32
#   REDIS_PASSWORD:    openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32
################################################################################
apiVersion: v1
kind: Secret
metadata:
  name: uniops-secrets
  namespace: uniops
  labels:
    app.kubernetes.io/name: uniops
  annotations:
    # Reminder for operators: rotate these secrets every 90 days
    secret-rotation-reminder: "rotate-every-90-days"
type: Opaque
stringData:
  # ── App security ─────────────────────────────────────────────────────────────
  SECRET_KEY: "REPLACE_WITH_openssl_rand_hex_32_output"
  JWT_SECRET_KEY: "REPLACE_WITH_openssl_rand_hex_32_output"

  # ── Database ──────────────────────────────────────────────────────────────────
  POSTGRES_USER: "uniops"
  POSTGRES_PASSWORD: "REPLACE_WITH_strong_password_min_32_chars"
  POSTGRES_DB: "uniops_db"

  # ── Redis AUTH (required — empty string will be rejected by setup-secrets.sh) ─
  REDIS_PASSWORD: "REPLACE_WITH_strong_password_min_32_chars"

  # ── Optional integrations (leave empty to use demo/mock data) ─────────────────
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

  GITHUB_TOKEN: ""
  GITHUB_WEBHOOK_SECRET: ""
  GITLAB_TOKEN: ""

  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

  SLACK_BOT_TOKEN: ""
  SLACK_WEBHOOK_URL: ""

  SENDGRID_API_KEY: ""

  SENTRY_DSN: ""
