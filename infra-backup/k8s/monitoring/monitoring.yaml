################################################################################
# Monitoring Stack — Prometheus Operator CRDs
#
# Prerequisites (install kube-prometheus-stack once per cluster):
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack \
#     prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false \
#     --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false
#
# Apply this file AFTER the main overlay:
#   kubectl apply -k k8s/monitoring
################################################################################

################################################################################
# ServiceMonitor — backend /metrics scraping
# Prometheus Operator discovers this and auto-configures scrape targets.
# Backend must expose Prometheus metrics (prometheus-fastapi-instrumentator).
################################################################################
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: uniops-backend
  namespace: monitoring
  labels:
    app.kubernetes.io/name: uniops-backend-monitor
    # This label must match the Prometheus Operator's serviceMonitorSelector
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - uniops
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      scheme: http

---
################################################################################
# PrometheusRule — Alert Definitions
# Prometheus evaluates these every 30s.
# Alerts fire → Alertmanager routes to Slack/PagerDuty/email.
################################################################################
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uniops-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: uniops-alerts
    release: kube-prometheus-stack
spec:
  groups:
    # ── Group 1: Service Availability ─────────────────────────────────────────
    - name: uniops.availability
      interval: 30s
      rules:
        - alert: UniOpsBackendDown
          # up == 0 means Prometheus can't scrape the target
          expr: up{job="uniops-backend", namespace="uniops"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "UniOps Backend is DOWN"
            description: "Backend pod {{ $labels.pod }} in {{ $labels.namespace }} has been unreachable for > 1 minute."
            runbook: "https://wiki.yourdomain.com/runbooks/backend-down"

        - alert: UniOpsPostgresDown
          # kube_statefulset_status_ready_replicas comes from kube-state-metrics
          expr: kube_statefulset_status_ready_replicas{statefulset="postgres", namespace="uniops"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "UniOps PostgreSQL is DOWN"
            description: "PostgreSQL StatefulSet has 0 ready replicas for > 1 minute."
            runbook: "https://wiki.yourdomain.com/runbooks/postgres-down"

        - alert: UniOpsRedisDown
          expr: kube_statefulset_status_ready_replicas{statefulset="redis", namespace="uniops"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "UniOps Redis is DOWN"
            description: "Redis StatefulSet has 0 ready replicas for > 1 minute."

        - alert: UniOpsCeleryWorkerDown
          expr: kube_deployment_status_replicas_ready{deployment="celery-worker", namespace="uniops"} == 0
          for: 2m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "UniOps Celery workers are DOWN"
            description: "All Celery worker pods are unavailable. Background tasks are not being processed."

    # ── Group 2: Error Rates ──────────────────────────────────────────────────
    - name: uniops.errors
      interval: 30s
      rules:
        - alert: UniOpsHighErrorRate
          # 5xx error fraction > 5% sustained for 5 minutes
          expr: |
            (
              rate(http_requests_total{namespace="uniops", status=~"5.."}[5m])
              /
              rate(http_requests_total{namespace="uniops"}[5m])
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "UniOps Backend high error rate: {{ $value | humanizePercentage }}"
            description: "More than 5% of HTTP requests are returning 5xx errors over the last 5 minutes."

        - alert: UniOpsVeryHighErrorRate
          expr: |
            (
              rate(http_requests_total{namespace="uniops", status=~"5.."}[5m])
              /
              rate(http_requests_total{namespace="uniops"}[5m])
            ) > 0.20
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "UniOps Backend CRITICAL error rate: {{ $value | humanizePercentage }}"
            description: "More than 20% of HTTP requests are returning 5xx errors."

    # ── Group 3: Latency ──────────────────────────────────────────────────────
    - name: uniops.latency
      interval: 30s
      rules:
        - alert: UniOpsHighLatencyP95
          # p95 response time > 2 seconds
          expr: |
            histogram_quantile(0.95,
              rate(http_request_duration_seconds_bucket{namespace="uniops"}[5m])
            ) > 2.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "UniOps Backend p95 latency is {{ $value | humanizeDuration }}"
            description: "95th percentile response time exceeds 2 seconds. Users are experiencing slow responses."

        - alert: UniOpsHighLatencyP99
          # p99 response time > 5 seconds
          expr: |
            histogram_quantile(0.99,
              rate(http_request_duration_seconds_bucket{namespace="uniops"}[5m])
            ) > 5.0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "UniOps Backend p99 latency is {{ $value | humanizeDuration }}"
            description: "99th percentile response time exceeds 5 seconds."

    # ── Group 4: Kubernetes Resources ─────────────────────────────────────────
    - name: uniops.kubernetes
      interval: 60s
      rules:
        - alert: UniOpsPodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="uniops"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has been restarting repeatedly."

        - alert: UniOpsPVCLowSpace
          # PVC usage > 85%
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="uniops"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="uniops"}
            ) > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
            description: "Persistent volume is running low on disk space. Expand the PVC before it fills."

        - alert: UniOpsHPAMaxed
          # HPA has reached its maximum replica count
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="uniops"}
            ==
            kube_horizontalpodautoscaler_spec_max_replicas{namespace="uniops"}
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} has reached maximum replicas"
            description: "The autoscaler is maxed out. Consider increasing maxReplicas or investigating the load."
