##############################################################################
# UniOps Control Tower — Docker Compose (Production-Ready)
#
# Architecture:
#   frontend (nginx :80) → backend (:8000) → db (:5432) + redis (:6379)
#   celery_worker + celery_beat → redis + db
#
# Service-to-service: use Docker DNS names (db, redis, backend)
# NEVER use localhost between containers.
#
# Usage:
#   docker compose up --build           # full stack
#   docker compose up db redis backend  # backend only (no Celery)
#   docker compose logs -f backend      # tail backend logs
##############################################################################

networks:
  uniops_net:
    driver: bridge

volumes:
  postgres_data:
  models_data:
  backend_logs:
  celery_beat_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - uniops_net
    environment:
      POSTGRES_USER: uniops
      POSTGRES_PASSWORD: uniops_password
      POSTGRES_DB: uniops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniops -d uniops_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - uniops_net
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ── Backend (FastAPI + uvicorn) ─────────────────────────────────────────────
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - uniops_net
    env_file: ./src/backend/.env.docker
    volumes:
      - ./src/backend/app:/app/app
      - ./src/backend/scripts:/app/scripts
      - models_data:/app/models
      - backend_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - uniops_net
    env_file: ./src/backend/.env.docker
    volumes:
      - ./src/backend/app:/app/app
      - ./src/backend/scripts:/app/scripts
      - models_data:/app/models
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.tasks.worker
      - worker
      - --loglevel=info
      - --concurrency=2
      - -Q
      - default,scans

  # ── Celery Beat ─────────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - uniops_net
    env_file: ./src/backend/.env.docker
    volumes:
      - celery_beat_data:/app/beat
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.tasks.worker
      - beat
      - --loglevel=info
      - --scheduler
      - celery.beat.PersistentScheduler
      - --schedule
      - /app/beat/celerybeat-schedule

  # ── Frontend (React → Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: unless-stopped
    networks:
      - uniops_net
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
