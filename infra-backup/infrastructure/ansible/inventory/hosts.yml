---
# ─────────────────────────────────────────────────────────────────────────────
# UniOps — Ansible Inventory
# عدّل الـ IPs دي بعد ما Terraform ينشئ الـ servers
# ─────────────────────────────────────────────────────────────────────────────

all:
  children:
    uniops_servers:
      hosts:
        uniops-prod-01:
          ansible_host: "{{ lookup('env', 'DEPLOY_HOST') }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: "~/.ssh/uniops-deploy"
          ansible_python_interpreter: /usr/bin/python3

      vars:
        # بتيجي من Terraform outputs
        db_host:    "{{ lookup('env', 'TF_OUTPUT_DATABASE_HOST') }}"
        redis_host: "{{ lookup('env', 'TF_OUTPUT_REDIS_HOST') }}"
        ecr_url:    "{{ lookup('env', 'TF_OUTPUT_ECR_BACKEND_URL') }}"
