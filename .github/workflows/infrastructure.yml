name: Infrastructure — Terraform + Ansible

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
  pull_request:
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  TF_VERSION: "1.6.0"
  AWS_REGION: us-east-1

jobs:
  # ── Terraform Plan / Apply ──────────────────────────────────────────────────
  terraform:
    name: 🏗️ Terraform ${{ inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="envs/${{ inputs.environment || 'dev' }}.tfvars" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 🏗️ Terraform Plan \`${{ steps.plan.outcome }}\`
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: |
          inputs.action == 'apply' &&
          github.ref == 'refs/heads/main' &&
          steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform Outputs
        if: inputs.action == 'apply'
        run: |
          terraform output -json > tf-outputs.json
          echo "TF_OUTPUT_DATABASE_HOST=$(terraform output -raw database_host)" >> $GITHUB_ENV
          echo "TF_OUTPUT_REDIS_HOST=$(terraform output -raw redis_host)" >> $GITHUB_ENV
          echo "TF_OUTPUT_ECR_BACKEND_URL=$(terraform output -raw ecr_backend_url)" >> $GITHUB_ENV

      - name: Upload outputs artifact
        if: inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: infrastructure/terraform/tf-outputs.json

  # ── Ansible Deploy (runs after Terraform apply) ────────────────────────────
  ansible:
    name: 🚀 Ansible Deploy
    runs-on: ubuntu-latest
    needs: terraform
    if: inputs.action == 'apply'
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Download terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: infrastructure/terraform/

      - name: Install Ansible
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install community.docker amazon.aws

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/uniops-deploy
          chmod 600 ~/.ssh/uniops-deploy

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        working-directory: infrastructure/ansible
        run: |
          ansible-playbook \
            -i inventory/hosts.yml \
            site.yml \
            --private-key ~/.ssh/uniops-deploy \
            -v

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed at: $(date)" >> $GITHUB_STEP_SUMMARY
