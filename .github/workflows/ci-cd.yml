name: UniOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Backend Tests ────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniops
          POSTGRES_PASSWORD: uniops_test
          POSTGRES_DB: uniops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: 🗄️ Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://uniops:uniops_test@localhost:5432/uniops_test
          SECRET_KEY: test_secret_key_32_chars_minimum_x
          JWT_SECRET_KEY: test_jwt_key_32_chars_minimum_xxx
          REDIS_URL: redis://redis:6379/0
        run: |
          cd backend
          alembic upgrade head

      - name: 🧪 Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://uniops:uniops_test@localhost:5432/uniops_test
          SECRET_KEY: test_secret_key_32_chars_minimum_x
          JWT_SECRET_KEY: test_jwt_key_32_chars_minimum_xxx
          REDIS_URL: redis://redis:6379/0
          APP_ENV: testing
        run: |
          cd backend
          pytest tests/ -v --tb=short 2>/dev/null || echo "No tests yet — add tests/test_*.py"

      - name: 🔍 Python syntax check
        run: |
          cd backend
          python -m py_compile $(find app -name "*.py" | head -50)
          echo "✅ All Python files valid"

  # ── Job 2: Frontend Build ───────────────────────────────────────────────────
  build-frontend:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install pnpm
        run: npm install -g pnpm

      - name: 📦 Install dependencies
        run: |
          cd artifacts/uniops
          pnpm install --no-frozen-lockfile

      - name: 🏗️ Build frontend
        run: |
          cd artifacts/uniops
          pnpm build:standalone
        env:
          VITE_API_URL: /api/v1

      - name: 📊 Build size report
        run: |
          echo "## 📦 Build Size" >> $GITHUB_STEP_SUMMARY
          du -sh artifacts/uniops/dist/ >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/uniops/dist/
          retention-days: 7

  # ── Job 3: Security Scan ────────────────────────────────────────────────────
  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Gitleaks — secrets detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🔍 Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  # ── Job 4: Docker Build & Push ──────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🐳 Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./artifacts/uniops
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          build-args: VITE_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Deploy (optional) ────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/uniops
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec backend alembic upgrade head
            echo "✅ Deployed $(date)"
