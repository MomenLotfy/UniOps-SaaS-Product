name: UniOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_ORG: uniops
  FRONTEND_IMAGE: uniops-frontend
  BACKEND_IMAGE: uniops-backend

jobs:
  # ─── 1. DevSecOps Scans (Parallel) ───────────────────────
  security-scans:
    name: 🔒 Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scan (Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table

      - name: Run Semgrep (Secrets + SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

  # ─── 2. Tests (Parallel) ─────────────────────────────────
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: security-scans
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd artifacts/uniops
          npm install

      - name: Frontend TypeCheck
        run: |
          cd artifacts/uniops
          npx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Backend Tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ─── 3. Build Docker Images (Parallel) ──────────────────
  build-images:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Build Tag
        run: |
          echo "BUILD_TAG=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "Building: $BUILD_TAG"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./artifacts/uniops
          file: ./artifacts/uniops/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_ORG }}/${{ env.FRONTEND_IMAGE }}:${{ env.BUILD_TAG }}
            ${{ env.DOCKER_ORG }}/${{ env.FRONTEND_IMAGE }}:latest

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_ORG }}/${{ env.BACKEND_IMAGE }}:${{ env.BUILD_TAG }}
            ${{ env.DOCKER_ORG }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Scan Images with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: |
            ${{ env.DOCKER_ORG }}/${{ env.BACKEND_IMAGE }}:${{ env.BUILD_TAG }}
            ${{ env.DOCKER_ORG }}/${{ env.FRONTEND_IMAGE }}:${{ env.BUILD_TAG }}
          format: table
          severity: HIGH,CRITICAL

  # ─── 4. Update K8s Manifests ────────────────────────────
  update-k8s:
    name: 📝 Update K8s Manifests
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: yokawasa/action-setup-kube-tools@v0.11.0
        with:
          kubectl: '1.29.0'
          kustomize: '5.3.0'

      - name: Update Image Tags
        run: |
          cd k8s/overlays/dev
          kustomize edit set image \
            uniops-frontend=${{ env.DOCKER_ORG }}/${{ env.FRONTEND_IMAGE }}:${{ env.BUILD_TAG }} \
            uniops-backend=${{ env.DOCKER_ORG }}/${{ env.BACKEND_IMAGE }}:${{ env.BUILD_TAG }}

      - name: Commit & Push Changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"
          git add k8s/
          git commit -m "ci: bump images to ${{ env.BUILD_TAG }}" || echo "No changes"
          git push origin main

  # ─── 5. Notify ──────────────────────────────────────────
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: update-k8s
    if: always()
    steps:
      - name: Pipeline Status
        run: |
          if [ "${{ needs.build-images.result }}" == "success" ]; then
            echo "✅ Pipeline completed successfully!"
            echo "📦 Build Tag: ${{ env.BUILD_TAG }}"
            echo "🔄 ArgoCD will auto-deploy to Kubernetes"
          else
            echo "❌ Pipeline failed!"
          fi
