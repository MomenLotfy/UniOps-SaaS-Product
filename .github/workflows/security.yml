name: Security Scanning

on:
  schedule:
    - cron: '0 2 * * 1'   # كل إثنين الساعة 2 صباحاً
  push:
    branches: [main]
  workflow_dispatch:        # تشغيل يدوي

jobs:
  # ── Dependency vulnerabilities ──────────────────────────────────────────────
  dependency-scan:
    name: 🔍 Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python deps (pip-audit)
        run: |
          pip install pip-audit
          cd backend
          pip-audit -r requirements.txt --format=json -o pip-audit-results.json || true
          cat pip-audit-results.json

      - name: Node deps (npm audit)
        run: |
          cd artifacts/uniops
          npm install -g pnpm
          pnpm install --no-frozen-lockfile
          pnpm audit --json > npm-audit-results.json || true

  # ── Secrets detection ───────────────────────────────────────────────────────
  secrets-scan:
    name: 🔑 Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # كامل الـ history

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Container scan ──────────────────────────────────────────────────────────
  container-scan:
    name: 🐳 Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t uniops-backend:scan ./backend

      - name: Trivy — container vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: uniops-backend:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Trivy — IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 0

  # ── SAST ────────────────────────────────────────────────────────────────────
  sast:
    name: 🔬 SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/secrets
            p/python
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true
