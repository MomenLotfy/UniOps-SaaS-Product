---
# File: /home/bisho/ansible/roles/jenkins-tools/tasks/git.yml
# Variables:
#   git_user_name: (default: "Jenkins Automation")
#   git_user_email: (default: "jenkins@example.com")
# Dependencies: none

- name: Install Git from official repository
  ansible.builtin.package:
    name: git
    state: present
  become: yes
  tags: [git, tools]

- name: Configure global Git user name
  ansible.builtin.command: git config --global user.name "{{ git_user_name | default('Jenkins Automation') }}"
  become: yes
  tags: [git, tools]
  notify: Git Config Changed

- name: Configure global Git user email
  ansible.builtin.command: git config --global user.email "{{ git_user_email | default('jenkins@example.com') }}"
  become: yes
  tags: [git, tools]
  notify: Git Config Changed

- name: Verify Git installation
  ansible.builtin.command: git --version
  register: git_version_output
  changed_when: false
  tags: [git, tools]

- name: Display Git version
  ansible.builtin.debug:
    msg: "Installed Git version: {{ git_version_output.stdout }}"
  tags: [git, tools]
