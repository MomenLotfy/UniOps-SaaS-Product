---
# File: /home/bisho/ansible/roles/jenkins-tools/tasks/nodejs.yml
#
# Purpose:
#   Install Node.js (node + npm) from the official NodeSource repository on
#   Ubuntu LTS hosts using the modern per-repository signing key model
#   (deb822 sources list + per-repo Signed-By keyring).
#
# Variables:
#   nodejs_version: (default: "20") - Major Node.js release to install.
#                                       Supported values: "20", "22", "24".
#
# Compatibility:
#   * Ubuntu 22.04 LTS (jammy)
#   * Ubuntu 24.04 LTS (noble)
#   * Ubuntu 26.04 LTS (resolute)
#
# Why this file is the way it is:
#   * `ansible.builtin.apt_key` is deprecated. We use `get_url` to download
#     the GPG key to `/etc/apt/keyrings/` instead.
#   * `ansible.builtin.deb822_repository` is not available in ansible-core 2.12,
#     so we use `ansible.builtin.apt_repository` with the `signed-by` option.
#   * The repository is declared with a `signed-by=` clause in the `repo`
#     string to scope trust to the per-repo keyring file.
#   * On Ubuntu 26.04 universe, the `nodejs` package does NOT bundle `npm`
#     (npm is in Suggests:, not Depends:). The NodeSource `nodejs` package
#     declares `Provides: npm`, so installing both packages is idempotent
#     and gives us a real npm binary on every supported host.
#
# References:
#   * https://github.com/nodesource/distributions
#   * https://manpages.ubuntu.com/manpages/noble/en/man5/sources.list.5.html
#   * https://docs.ansible.com/ansible-core/2.18/collections/ansible/builtin/deb822_repository_module.html

- name: Node.js | Install apt prerequisites (Debian)
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_os_family == 'Debian'
  tags: [nodejs, runtime]

- name: Node.js | Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: ansible_os_family == 'Debian'
  tags: [nodejs, runtime]

- name: Node.js | Download NodeSource apt GPG key (Debian)
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: '0644'
  become: true
  when: ansible_os_family == 'Debian'
  tags: [nodejs, runtime]

- name: Node.js | Add NodeSource apt repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ('arm64' if ansible_architecture == 'aarch64' else ansible_architecture) }} signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_version | default('20') }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == 'Debian'
  tags: [nodejs, runtime]

- name: Node.js | Install Node.js and npm (Debian)
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_os_family == 'Debian'
  tags: [nodejs, runtime]

- name: Node.js | Remove old nodesource repo if exists (RedHat)
  ansible.builtin.file:
    path: /etc/yum.repos.d/nodesource-nodejs.repo
    state: absent
  become: true
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [nodejs, runtime]

- name: Node.js | Run NodeSource setup script (RedHat/Amazon)
  # NOTE: Node.js 20.x+ requires glibc >= 2.28. Amazon Linux 2 provides glibc 2.26.
  # We downgrade to 16.x for Amazon Linux 2 compatibility.
  ansible.builtin.shell: "curl -fsSL https://rpm.nodesource.com/setup_16.x | bash -"
  become: true
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [nodejs, runtime]

- name: Node.js | Clean yum cache (RedHat)
  ansible.builtin.command: yum clean all
  become: true
  changed_when: false
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [nodejs, runtime]

- name: Node.js | Install Node.js (RedHat)
  ansible.builtin.yum:
    name: nodejs
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [nodejs, runtime]

- name: Node.js | Verify node binary
  ansible.builtin.command: node --version
  register: nodejs_node_version
  changed_when: false
  check_mode: false
  failed_when: nodejs_node_version.rc != 0
  tags: [nodejs, runtime]

- name: Node.js | Verify npm binary
  ansible.builtin.command: npm --version
  register: nodejs_npm_version
  changed_when: false
  check_mode: false
  failed_when: nodejs_npm_version.rc != 0
  tags: [nodejs, runtime]

- name: Node.js | Report installed versions
  ansible.builtin.debug:
    msg:
      - "Node.js: {{ nodejs_node_version.stdout }}"
      - "npm:     {{ nodejs_npm_version.stdout }}"
      - "node    : {{ nodejs_node_version.stdout | regex_replace('^v', '') }}"
      - "npm     : {{ nodejs_npm_version.stdout }}"
  tags: [nodejs, runtime]
