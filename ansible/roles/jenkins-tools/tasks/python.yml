---
# File: /home/bisho/ansible/roles/jenkins-tools/tasks/python.yml
# Variables:
#   python_version: (default: "3") - Major Python version.
# Dependencies: none

- name: Install Python 3 and development tools (Debian)
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
    state: present
    update_cache: yes
  become: yes
  when: ansible_os_family == 'Debian'
  tags: [python, runtime]

- name: Install Python 3 and development tools (RedHat)
  ansible.builtin.yum:
    name:
      - python3
      - python3-pip
      - python3-devel
    state: present
    update_cache: yes
  become: yes
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [python, runtime]

- name: Set python3 as the default python using update-alternatives
  ansible.builtin.shell: |
    update-alternatives --install /usr/bin/python python /usr/bin/python3 1
  become: yes
  when: ansible_os_family == 'Debian'
  tags: [python, runtime]

- name: Verify Python installation
  ansible.builtin.command: python3 --version
  register: python_version_output
  changed_when: false
  tags: [python, runtime]

- name: Verify Pip installation
  ansible.builtin.command: pip3 --version
  register: pip_version_output
  changed_when: false
  tags: [python, runtime]

- name: Display Python and Pip versions
  ansible.builtin.debug:
    msg: "Python: {{ python_version_output.stdout }}, Pip: {{ pip_version_output.stdout }}"
  tags: [python, runtime]
