---
# File: /home/bisho/ansible/roles/jenkins-tools/tasks/trivy.yml
#
# Purpose:
#   Install Trivy (container security scanner) from the official Aqua Security
#   apt repository using the modern per-repository signing key model
#   (key in /etc/apt/keyrings/, repo entry references it via signed-by=).
#
# Compatibility:
#   * Ubuntu 22.04 LTS (jammy)
#   * Ubuntu 24.04 LTS (noble)
#   * Ubuntu 26.04 LTS (resolute)
#
# Why this file is the way it is:
#   * The legacy `apt-key add -` pipeline is REMOVED from Ubuntu 24.04+ and
#     is deprecated in ansible-core 2.18 (removed in 2.25). We never invoke
#     it. Instead the key is downloaded with `get_url` and dearmored with
#     `gpg --dearmor` (the only step that still requires a shell because
#     no native Ansible module dearmors keys), gated by `creates:`.
#   * The repository is declared with `apt_repository` and a `signed-by=`
#     clause that scopes trust to the per-repo keyring file.
#   * `wget` was replaced with `curl` for consistency with the rest of the
#     role (the prereqs install `curl` but not `wget`).

- name: Trivy | Remove stale trivy repo file (RedHat/Amazon)
  ansible.builtin.file:
    path: /etc/yum.repos.d/trivy.repo
    state: absent
  become: true
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [trivy, security]

- name: Trivy | Install apt prerequisites (Debian)
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_os_family == 'Debian'
  tags: [trivy, security]

- name: Trivy | Add Trivy yum repository (RedHat/Amazon)
  ansible.builtin.yum_repository:
    name: trivy
    description: Trivy repository
    baseurl: "https://get.trivy.dev/rpm/releases/$basearch/"
    gpgkey: https://get.trivy.dev/rpm/public.key
    gpgcheck: yes
    enabled: yes
  become: true
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [trivy, security]

- name: Trivy | Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: ansible_os_family == 'Debian'
  tags: [trivy, security]

- name: Trivy | Download Trivy public GPG key (ASCII armored, staged in /tmp)
  ansible.builtin.get_url:
    url: https://aquasecurity.github.io/trivy-repo/deb/public.key
    dest: /tmp/trivy.key.asc
    owner: root
    group: root
    mode: '0644'
    force: false
  become: true
  when: ansible_os_family == 'Debian'
  tags: [trivy, security]

- name: Trivy | Dearmor Trivy public GPG key to binary keyring
  ansible.builtin.shell:
    cmd: gpg --dearmor < /tmp/trivy.key.asc > /etc/apt/keyrings/trivy.gpg
    creates: /etc/apt/keyrings/trivy.gpg
  become: true
  changed_when: false
  when: ansible_os_family == 'Debian'
  tags: [trivy, security]

- name: Trivy | Add Trivy apt repository (signed-by keyring)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main"
    filename: trivy
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == 'Debian'
  tags: [trivy, security]

- name: Trivy | Install Trivy via apt (Debian)
  ansible.builtin.apt:
    name: trivy
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_os_family == 'Debian'
  tags: [trivy, security]

- name: Trivy | Install Trivy via yum (RedHat)
  ansible.builtin.yum:
    name: trivy
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [trivy, security]

- name: Trivy | Verify trivy binary
  ansible.builtin.command: trivy --version
  register: trivy_version_output
  changed_when: false
  check_mode: false
  failed_when: trivy_version_output.rc != 0
  tags: [trivy, security]

- name: Trivy | Display installed version
  ansible.builtin.debug:
    msg: "Installed Trivy version: {{ trivy_version_output.stdout }}"
  tags: [trivy, security]
