---
# File: /home/bisho/ansible/roles/jenkins-tools/tasks/build-essential.yml
# Variables: none
# Dependencies: none

- name: build-essential | Remove stale trivy repo file (RedHat/Amazon)
  ansible.builtin.file:
    path: /etc/yum.repos.d/trivy.repo
    state: absent
  become: true
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [build-essential, tools]

- name: Install build-essential and common development libraries (Debian)
  ansible.builtin.apt:
    name:
      - build-essential
      - gcc
      - g++
      - make
      - libssl-dev
      - libffi-dev
      - python3-dev
    state: present
    update_cache: yes
  become: yes
  when: ansible_os_family == 'Debian'
  tags: [build-essential, tools]

- name: Install Development Tools and libraries (RedHat/Amazon)
  ansible.builtin.yum:
    name:
      - "@Development Tools"
      - gcc
      - gcc-c++
      - make
      - openssl-devel
      - libffi-devel
      - python3-devel
    state: present
    update_cache: yes
  become: yes
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Amazon'
  tags: [build-essential, tools]

- name: Verify gcc installation
  ansible.builtin.command: gcc --version
  register: gcc_version_output
  changed_when: false
  tags: [build-essential, tools]

- name: Verify make installation
  ansible.builtin.command: make --version
  register: make_version_output
  changed_when: false
  tags: [build-essential, tools]

- name: Display GCC and Make versions
  ansible.builtin.debug:
    msg:
      - "GCC: {{ gcc_version_output.stdout_lines[0] | default('Not Found') }}"
      - "Make: {{ make_version_output.stdout_lines[0] | default('Not Found') }}"
  tags: [build-essential, tools]
