---
# File: /home/bisho/ansible/roles/jenkins-tools/tasks/awscli.yml
#
# Purpose:
#   Install AWS CLI v2 on Ubuntu LTS hosts from the official AWS ZIP
#   distribution, using a per-task idempotency guard.
#
# Compatibility:
#   * Ubuntu 22.04 LTS (jammy)
#   * Ubuntu 24.04 LTS (noble)
#   * Ubuntu 26.04 LTS (resolute)
#
# Notes:
#   * The AWS CLI v2 distribution is a ZIP whose top-level directory inside
#     the archive is `aws/`, containing the `install` script and the `dist/`
#     payload. So the correct invocation is `/tmp/aws/install`, not
#     `/tmp/aws-cli-exe-installer` (that name is a long-standing misnaming
#     in older guides and does not exist on disk).
#   * `unarchive` with `dest: /tmp/` extracts `awscliv2.zip` into
#     `/tmp/aws/{install,dist,README.md,...}`.
#   * The install is skipped entirely if `aws --version` already succeeds
#     (i.e. AWS CLI v2 is already on PATH), which makes the role idempotent.

- name: AWS CLI | Check if already installed
  ansible.builtin.command: /usr/local/bin/aws --version
  register: awscli_installed_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [awscli, tools]

- name: AWS CLI | Download awscliv2.zip (skipped if already installed)
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: '0644'
    force: false
  become: true
  when: awscli_installed_check.rc != 0
  tags: [awscli, tools]

- name: AWS CLI | Ensure unzip is installed (skipped if already installed)
  ansible.builtin.package:
    name: unzip
    state: present
  become: true
  when: awscli_installed_check.rc != 0
  tags: [awscli, tools]

- name: AWS CLI | Remove any previous /tmp/aws extraction (skipped if already installed)
  ansible.builtin.file:
    path: /tmp/aws
    state: absent
  become: true
  when: awscli_installed_check.rc != 0
  tags: [awscli, tools]

- name: AWS CLI | Unzip awscliv2.zip into /tmp (skipped if already installed)
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp/
    remote_src: true
  become: true
  when: awscli_installed_check.rc != 0
  tags: [awscli, tools]

- name: AWS CLI | Run installer from /tmp/aws/install (skipped if already installed)
  ansible.builtin.command:
    cmd: /tmp/aws/install --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin
  become: true
  changed_when: true
  when: awscli_installed_check.rc != 0
  tags: [awscli, tools]

- name: AWS CLI | Clean up installer artifacts (skipped if already installed)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /tmp/awscliv2.zip
    - /tmp/aws
  when: awscli_installed_check.rc != 0
  tags: [awscli, tools]

- name: AWS CLI | Verify installation
  ansible.builtin.command: /usr/local/bin/aws --version
  register: awscli_version_output
  changed_when: false
  check_mode: false
  failed_when: awscli_version_output.rc != 0
  tags: [awscli, tools]

- name: AWS CLI | Display installed version
  ansible.builtin.debug:
    msg: "Installed AWS CLI version: {{ awscli_version_output.stdout }}"
  tags: [awscli, tools]
