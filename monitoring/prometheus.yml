global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'uniops-monitor'

rule_files:
  - "alerts.yml"

scrape_configs:
  # ── UniOps FastAPI Backend ─────────────────────────────────────────────────
  - job_name: 'uniops-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ── UniOps Node.js API ────────────────────────────────────────────────────
  - job_name: 'uniops-node-api'
    static_configs:
      - targets: ['node_api:3001']
    metrics_path: '/api/health'
    scrape_interval: 30s

  # ── Celery / Flower ────────────────────────────────────────────────────────
  - job_name: 'celery-flower'
    static_configs:
      - targets: ['flower:5555']
    metrics_path: '/metrics'
    scrape_interval: 30s
