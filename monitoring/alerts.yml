groups:
  - name: uniops_alerts
    rules:
      # Backend down
      - alert: BackendDown
        expr: up{job="uniops-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "UniOps backend is down"
          description: "Backend has been unreachable for more than 1 minute"

      # High API latency
      - alert: HighAPILatency
        expr: http_request_duration_seconds{quantile="0.95"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API response time > 2s (p95)"

      # DB connections exhausted
      - alert: DatabaseConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections > 80"

      # Redis memory high
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 85%"

      # Celery task failures
      - alert: CeleryTasksFailing
        expr: rate(celery_tasks_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery tasks failing at {{ $value }} per second"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space below 15%"
