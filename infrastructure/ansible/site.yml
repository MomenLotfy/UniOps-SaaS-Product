---
# ─────────────────────────────────────────────────────────────────────────────
# UniOps — Ansible Playbook
# ─────────────────────────────────────────────────────────────────────────────
# ما بيعمله:
#   - يجهّز الـ server (packages, docker, security)
#   - يـdeploy المنصة بالكامل
#   - يعمل database migrations
#   - يتحقق إن كل حاجة شغالة
#
# استخدام:
#   ansible-playbook -i inventory/hosts.yml site.yml
#   ansible-playbook -i inventory/hosts.yml site.yml --tags deploy
# ─────────────────────────────────────────────────────────────────────────────

- name: 🖥️  Setup Server
  hosts: uniops_servers
  become: true
  roles:
    - role: server_setup
      tags: [setup]

- name: 🐳 Deploy UniOps
  hosts: uniops_servers
  become: true
  roles:
    - role: backend
      tags: [deploy, backend]
    - role: frontend
      tags: [deploy, frontend]
    - role: monitoring
      tags: [monitoring]
