# Trivy Configuration for UniOps
# Documentation: https://aquasecurity.github.io/trivy/latest/docs/references/config/

# Global settings
quiet: false
debug: false

# Scan settings
scan:
  # Skip directories that are not relevant
  skip-dirs:
    - node_modules/
    - .git/
    - __pycache__/
    - .venv/
    - artifacts/uniops/node_modules/
  # Skip files
  skip-files:
    - "*.test.*"
    - "*.spec.*"
    - "*.min.*"
  # Offline scan (no network calls)
  offline-scan: true

# Vulnerability settings
vulnerability:
  # Only fail on these severity levels
  severity:
    - CRITICAL
    - HIGH
  # Ignore unfixed vulnerabilities
  ignore-unfixed: true

# Output formats
format: table
output: trivy-report.txt

# Misconfiguration scanning (IaC security)
misconfiguration:
  # Enable misconfiguration scanning
  scanners:
    - terraform
    - dockerfile
    - kubernetes

# Secret scanning
secret:
  # Enable secret scanning
  enable: true

# SBOM generation
sbom:
  format: cyclonedx
  output: sbom.json